# One database per Spring context: DB_CLOSE_DELAY=-1 keeps an in-memory database alive past the
# last connection, so a fixed name would let one test class read rows another class wrote.
spring.datasource.url=jdbc:h2:mem:staffing-${random.uuid};DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate

# This file shadows the main application.properties on the test classpath, so every key the API
# tests rely on has to be repeated here. A body carrying a field no request record declares is
# refused rather than silently stripped, which is what the Non-Goal checks assert (task T29).
spring.jackson.deserialization.fail-on-unknown-properties=true
