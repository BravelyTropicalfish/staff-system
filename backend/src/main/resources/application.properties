spring.application.name=staffing

# File database for dev runs; tests override this with an in-memory URL.
spring.datasource.url=jdbc:h2:file:./data/staffing;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# schema.sql owns the schema (task T04); Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# A body carrying a field no request record declares is refused, not ignored: the Non-Goals
# (part-time percentage, rate and budget, travel destination, tenant) must not be accepted silently.
spring.jackson.deserialization.fail-on-unknown-properties=true

# Never leak stack traces to a client (security-baseline).
server.error.include-stacktrace=never
server.error.include-message=never
